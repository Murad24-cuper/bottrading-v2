name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check with Python 3.11 rules (Wine runtime compatibility)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --quiet uv
          uv run -p 3.11 --no-project python -c "import ast,pathlib; [ast.parse(f.read_text(encoding='utf-8')) for f in pathlib.Path('.').rglob('*.py') if '.git' not in f.parts]; print('py3.11 syntax OK')"
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
